name: Paper 1.18.2 compile and packaging check
on:
  push:
    branches: ['compat/1.18.2']
  pull_request:
    branches: ['compat/1.18.2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Compile and test Paper 1.18.2 on Java 17
        run: gradle clean test build -PpaperApiVersion=1.18.2-R0.1-SNAPSHOT -PcompileJavaVersion=17 -PbytecodeJavaVersion=17 --stacktrace
      - name: Check plugin archive and target API
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*_1.18.2.jar' -type f | head -n 1)
          test -n "$JAR"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Eq "api-version: ['\"]?1.18['\"]?"
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-1.18.2-compile-artifact
          path: build/libs/*_1.18.2.jar
          if-no-files-found: error
