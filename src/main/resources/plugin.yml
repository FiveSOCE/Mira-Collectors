name: MiraCollectors
version: ${version}
main: gg.mira.collectors.MiraCollectorsPlugin
api-version: '1.21'
author: FiveSOCE
description: Chunk-bound faction collectors with virtual high-capacity storage.
depend: [MiraCore, MiraFactions, Vault]
softdepend: [MiraShop, MiraCosmetics]
commands:
  collector:
    description: Manage collectors
    usage: /collector <info|upgrade|mode|give>
    permission: miracollectors.use
permissions:
  miracollectors.use: {default: true}
  miracollectors.admin: {default: op}
