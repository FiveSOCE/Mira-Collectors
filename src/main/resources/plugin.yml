name: MiraCollectors
version: 0.1.2
main: gg.mira.collectors.MiraCollectorsPlugin
api-version: '1.21'
author: FiveSOCE
description: Protected persistent item collectors with STORE and transactional MiraShop SELL modes.
depend: [MiraCore, Vault]
softdepend: [MiraShop, MiraCosmetics]
commands:
  collector:
    description: Manage collectors
    usage: /collector <info|mode|upgrade|give>
    permission: miracollectors.use
permissions:
  miracollectors.use: {default: true}
  miracollectors.admin: {default: op}
